<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#17251e"><meta name="description" content="狸は同じ場所にうんこする。タヌキのうんこで戦う縦型ドッジゲーム。"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="狸は同じ場所にうんこする"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>狸は同じ場所にうんこする</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17251e;color:#fff5db;font-family:system-ui,"Yu Gothic",sans-serif;display:grid;place-items:center;min-height:100svh}.wrap{width:min(100vw,480px);padding:12px}.top{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px}.brand{font-weight:900;font-size:19px}.hint{font-size:11px;opacity:.75}.arena{position:relative;width:100%;aspect-ratio:3/5;border:4px solid #d8c89e;border-radius:20px;overflow:hidden;background:#88ae75;box-shadow:0 14px 50px #0006}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;inset:0;pointer-events:none}.bar{position:absolute;left:7%;right:7%;height:8px;background:#263329;border:1px solid #e9dfc3;border-radius:8px;overflow:hidden}.bar.enemy{top:5%}.bar.player{bottom:5%}.fill{height:100%;background:#e77158;transition:width .2s}.player .fill{background:#e7c752}.label{position:absolute;font-size:12px;font-weight:800;text-shadow:0 2px 3px #253326;top:-19px}.msg{position:absolute;top:11%;left:0;right:0;text-align:center;font-size:14px;font-weight:800;text-shadow:0 2px 4px #263329;opacity:0;transition:opacity .2s}.msg.show{opacity:1}.controls{display:flex;justify-content:space-between;align-items:center;padding:11px 4px 0;gap:8px}.pad{display:flex;gap:8px}.btn{border:0;border-radius:15px;background:#ead9ae;color:#263329;font-weight:900;font-size:16px;min-width:58px;height:52px;box-shadow:0 4px 0 #a88f5f;touch-action:none;user-select:none}.btn:active,.btn.down{transform:translateY(3px);box-shadow:0 1px 0 #a88f5f;background:#f5e7c2}.throw{background:#e77856;color:#fff;min-width:116px}.fanbtn{background:#9bc9bb;min-width:68px}.power{display:flex;flex-direction:column;align-items:center;font-size:10px;min-width:110px;color:#f8f0d9}.power input{width:105px;accent-color:#efcb59}.power span{font-size:11px;font-weight:800}.foot{text-align:center;font-size:11px;opacity:.68;margin:8px 0 0}.overlay{position:absolute;inset:0;background:#14251ddf;display:grid;place-items:center;pointer-events:none;text-align:center;padding:36px}.overlay.hide{display:none}.card{background:#f3e6c4;color:#2e392c;border-radius:20px;padding:20px 18px;box-shadow:0 8px 24px #14251d77;pointer-events:none}.card h2{font-size:21px;margin:0 0 8px}.card p{font-size:13px;line-height:1.55;margin:5px 0 14px}.card button{border:0;border-radius:14px;padding:12px 23px;background:#e77856;color:white;font-weight:900;font-size:16px;pointer-events:auto}.powerTip{position:absolute;bottom:10%;left:0;right:0;text-align:center;font-size:12px;font-weight:800;text-shadow:0 2px 5px #243625;pointer-events:none}.powerTip.hide{display:none}
.storebar{display:flex;justify-content:space-between;align-items:center;padding:8px 5px 0}.storebar button{border:0;border-radius:12px;padding:9px 14px;background:#f1d46e;color:#263329;font-weight:900}.coins{font-weight:900}.shopOverlay{position:fixed;inset:0;background:#11231dcc;display:grid;place-items:center;z-index:20;padding:18px}.shopOverlay.hide{display:none}.shopCard{width:min(420px,94vw);background:#f3e6c4;color:#263329;border-radius:20px;padding:18px;max-height:85vh;overflow:auto}.shopHead{display:flex;justify-content:space-between;align-items:center}.shopHead h2{margin:0}.shopHead button,.shopItem button{border:0;border-radius:10px;padding:8px 12px;font-weight:800}.shopItem{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #cfbd95;padding:10px 0}.shopItem small{display:block;opacity:.75}.shopItem button{background:#df805c;color:white;min-width:96px}.shopItem button:disabled{background:#91a48a;color:white}.special{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px}.gaugeTrack{width:120px;height:12px;border-radius:8px;background:#263329;overflow:hidden;border:1px solid #f2e6c6}.gaugeTrack i{display:block;width:0;height:100%;background:#e6c74e;transition:width .2s}.special button{border:0;border-radius:12px;padding:10px 12px;background:#bd4f66;color:white;font-weight:900}.special button:disabled{opacity:.45}.againBar{display:flex;justify-content:center;padding:8px}.againBar.hide{display:none}.againBar button{border:0;border-radius:14px;padding:12px 24px;background:#f1d46e;color:#263329;font-weight:900;font-size:16px} .onlineBox{display:grid;gap:7px;margin-top:12px}.onlineBox input{min-width:0;border:2px solid #bba77c;border-radius:10px;padding:10px;text-align:center;font-size:16px}.onlineBox button{font-size:14px;padding:10px 12px}.onlineBox small{font-size:11px}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}@media(max-width:380px){.wrap{padding:6px}.special{gap:4px}.special button{font-size:11px;padding:8px 7px}.brand{font-size:16px}} </style>
<body><main class="wrap"><header class="top"><div class="brand">🍃 狸は同じ場所にうんこする</div><div class="hint">同じ場所に、また落ちる。</div></header><div class="arena"><canvas id="game" width="480" height="800"></canvas><div class="hud"><div class="bar enemy"><span class="label">あいて</span><div class="fill" id="eh"></div></div><div class="bar player"><span class="label">あなた</span><div class="fill" id="ph"></div></div><div class="msg" id="msg"></div><div class="powerTip hide" id="powerTip">投げる力をためています…</div></div><div class="overlay" id="setup"><div class="card"><h2>試合の準備</h2><p>下側があなた、上側がコンピューターです。<br>「試合開始」を押して対戦しましょう。</p><button id="start">試合開始</button></div></div><div class="overlay hide" id="over"></div></div><div class="special"><span>うんこゲージ <b id="gaugeText">0/10</b></span><div class="gaugeTrack"><i id="gaugeFill"></i></div><button id="specialBtn" disabled>5：しびれ</button><button id="megaBtn" disabled>5：大ダメージ</button><button id="invisBtn" disabled>10：3秒透明</button></div><div class="againBar hide" id="againBar"><button id="again">もう一度あそぶ</button></div><div class="foot">下側をタップして人間を移動。5ゲージでしびれ／大ダメージ、10ゲージで3秒透明。30秒ごとに速度上昇。</div></main>
<script>
(()=>{
const c=document.querySelector('#game'),g=c.getContext('2d'),setup=document.querySelector('#setup'),card=setup.querySelector('.card'),start=document.querySelector('#start'),over=document.querySelector('#over'),msg=document.querySelector('#msg'),specialBtn=document.querySelector('#specialBtn'),megaBtn=document.querySelector('#megaBtn'),invisBtn=document.querySelector('#invisBtn'),gaugeFill=document.querySelector('#gaugeFill'),gaugeText=document.querySelector('#gaugeText');
const W=480,H=800,clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let phase='ready',started=false,tick=0,frameN=0,simAccumulator=0,resultSide=null,finishAt=0,foxEvent=false,foxes=[],mines=[],latrineP={x:65,y:710},latrineE={x:415,y:90},p,e,piles=[],poopFx=[],walkers=[],gauge=0,cpuGauge=0,poopClock={p:70,e:70};
function reset(){started=false;phase='ready';tick=0;frameN=0;simAccumulator=0;resultSide=null;finishAt=0;foxEvent=false;foxes=[];mines=[];latrineP={x:65,y:710};latrineE={x:415,y:90};piles=[];poopFx=[];walkers=[];gauge=0;cpuGauge=0;poopClock={p:70,e:70};p={x:240,y:635,home:{x:240,y:635},hp:100,mode:'wait',stun:0};e={x:240,y:165,home:{x:240,y:165},hp:100,mode:'wait',stun:0};setup.classList.remove('hide');card.style.display='block';start.disabled=false;start.style.opacity='1';over.classList.add('hide');document.querySelector('#againBar').classList.add('hide');updateGauge()}
function say(t){msg.textContent=t;msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),1250)}
function human(h,color,label){let ghost=h===p&&h.invUntil>performance.now();if(ghost)g.globalAlpha=.25;g.fillStyle=color;g.beginPath();g.ellipse(h.x,h.y+10,19,25,0,0,7);g.fill();g.fillStyle='#efc7a2';g.beginPath();g.arc(h.x,h.y-19,16,0,7);g.fill();g.fillStyle='#543b2c';g.beginPath();g.arc(h.x,h.y-24,17,Math.PI,Math.PI*2);g.fill();g.fillStyle='#29251f';g.beginPath();g.arc(h.x-5,h.y-19,2,0,7);g.arc(h.x+5,h.y-19,2,0,7);g.fill();g.fillStyle='#fff';g.font='bold 12px system-ui';g.textAlign='center';g.fillText(label,h.x,h.y+48);if(h.stun>0){g.fillStyle='#ffec70';g.font='22px sans-serif';g.fillText('⚡',h.x,h.y-40)}if(ghost)g.globalAlpha=1}
function tanuki(q,label){if(!q)return;let x=q.x,y=q.y;g.fillStyle='#674a35';g.beginPath();g.ellipse(x,y+8,18,20,0,0,7);g.fill();g.fillStyle='#a17a50';g.beginPath();g.arc(x,y-10,18,0,7);g.fill();g.fillStyle='#f1e4c7';g.beginPath();g.ellipse(x-7,y-10,7,5,0,0,7);g.ellipse(x+7,y-10,7,5,0,0,7);g.fill();g.fillStyle='#31281f';g.beginPath();g.arc(x-7,y-10,2,0,7);g.arc(x+7,y-10,2,0,7);g.fill();g.fillStyle='#a17a50';g.beginPath();g.arc(x-14,y-25,6,0,7);g.arc(x+14,y-25,6,0,7);g.fill();g.fillStyle='white';g.font='bold 11px system-ui';g.textAlign='center';g.fillText(label,x,y+37)}
function updateGauge(){gaugeText.textContent=gauge+'/10';gaugeFill.style.width=(gauge*10)+'%';specialBtn.disabled=gauge<5||!started;megaBtn.disabled=gauge<5||!started;invisBtn.disabled=gauge<10||!started}
function fetchUnit(h,side){if(h.stun>0){h.stun--;return}let i=piles.findIndex(q=>q.side===side);if(h.mode==='wait'&&i>=0){h.target=piles.splice(i,1)[0];h.mode='fetch';poopClock[side]=70}if(h.mode==='move'){let dx=h.home.x-h.x,dy=h.home.y-h.y,d=Math.hypot(dx,dy);if(d<5){h.x=h.home.x;h.y=h.home.y;h.mode='wait'}else{h.x+=dx/d*1.8;h.y+=dy/d*1.8}}else if(h.mode==='fetch'||h.mode==='return'){let goal=h.mode==='fetch'?h.target:h.home,dx=goal.x-h.x,dy=goal.y-h.y,d=Math.hypot(dx,dy);if(d<5){h.x=goal.x;h.y=goal.y;if(h.mode==='fetch'){h.mode='return';if(side==='e'&&!onlineRole)h.home.x=clamp(p.home.x,35,445)}else{h.mode='wait';releaseWalker(h,side,'normal')}}else{h.x+=dx/d*1.8;h.y+=dy/d*1.8}}}
function releaseWalker(h,side,kind='normal'){let big=kind!=='normal';walkers.push({x:h.x,y:h.y+(side==='p'?-18:18),side,super:big,kind,stun:kind==='stun'?320:0,dead:false,step:0});if(kind==='normal'&&side==='p'){gauge=Math.min(10,gauge+1);updateGauge()}else if(kind==='normal'&&side==='e'){cpuGauge++;if(cpuGauge>=5){cpuGauge=0;walkers.push({x:h.x,y:h.y+18,side:'e',super:true,kind:'stun',stun:320,dead:false,step:0});say('コンピューターがしびれうんこを放った！')}}}
function useSuper(){if(!started||gauge<5)return;gauge-=5;updateGauge();releaseWalker(p,'p','stun');say('特大しびれうんこ！')}
function useMega(){if(!started||gauge<5)return;gauge-=5;updateGauge();releaseWalker(p,'p','mega');say('大ダメージうんこ！')}
function useInvisible(){if(!started||gauge<10)return;gauge-=10;p.invUntil=performance.now()+3000;updateGauge();say('3秒間透明！')}
function thinkCPU(){if(e.stun>0)return;if(tick%24===0&&e.mode==='wait'){let xs=[55,145,240,335,425],best=xs[0],score=-Infinity;for(let x of xs){let s=-Math.abs(x-(p.x+(p.home.x-p.x)*.45))*1.25;for(let b of walkers)if(b.side==='p'&&Math.abs(b.y-175)<230)s+=Math.min(85,Math.abs(x-b.x)*.75);for(let q of piles)if(q.side==='e')s-=Math.abs(x-q.x)*.04;if(s>score){score=s;best=x}}if(Math.abs(best-e.home.x)>35){e.home={x:best,y:155};e.mode='move'}}}
function finish(){started=false;resultSide=p.hp<=0?'p':'e';finishAt=performance.now();over.classList.add('hide');document.querySelector('#againBar').classList.remove('hide');updateGauge()}
function makeFox(side){let dir=Math.random()<.5?1:-1,y=side==='e'?80+Math.random()*270:450+Math.random()*270;foxes.push({x:dir>0?-36:516,y,targetX:75+Math.random()*330,dir,side,state:'walk',windupUntil:0,step:0,dropped:false})}function updateFoxes(){for(let fox of foxes){fox.step++;if(fox.state==='walk'){fox.x+=fox.dir*1.15;if((fox.dir>0&&fox.x>=fox.targetX)||(fox.dir<0&&fox.x<=fox.targetX)){fox.x=fox.targetX;fox.state='windup';fox.windupUntil=performance.now()+2200;say('キツネが身構えている！')}}else if(fox.state==='windup'&&performance.now()>=fox.windupUntil&&!fox.dropped){mines.push({x:clamp(fox.targetX+(Math.random()-.5)*18,30,450),y:fox.y,side:fox.side});fox.dropped=true;fox.state='exit';say('ぷりっ！ キツネがうんこを1個置いた！')}else if(fox.state==='exit'){fox.x+=fox.dir*1.15}}foxes=foxes.filter(f=>f.x>-55&&f.x<535)}
function update(){if(started){frameN++;if(frameN>=3600&&!foxEvent){foxEvent=true;makeFox('p');makeFox('e');say('1分経過！各コートにキツネが来た！')}updateFoxes();simAccumulator+=.5+Math.min(5,Math.floor(frameN/1800))*.2;while(simAccumulator>=1){simAccumulator-=1;tick++;for(let side of ['p','e']){if(poopClock[side]<999&&--poopClock[side]===0&&!piles.some(q=>q.side===side)&&!poopFx.some(q=>q.side===side)){let loc=side==='p'?latrineP:latrineE;poopFx.push({x:loc.x+17,y:loc.y+16,side,t:0});poopClock[side]=999}}for(let q of poopFx){q.t++;if(q.t>24){piles.push({x:q.x,y:q.y,side:q.side});q.dead=true}}poopFx=poopFx.filter(q=>!q.dead);thinkCPU();fetchUnit(p,'p');fetchUnit(e,'e');for(let w of walkers){w.step++;w.y+=w.side==='p'?-0.55:.55;let target=w.side==='p'?e:p;if(Math.abs(w.x-target.x)<25&&Math.abs(w.y-target.y)<26){let safe=target===p&&p.invUntil>performance.now();if(!safe){target.hp-=w.kind==='mega'?36:18;if(w.kind==='stun')target.stun=320;say(w.kind==='stun'?'しびれうんこが直撃！':w.kind==='mega'?'大ダメージ！':'うんこが直撃！')}else say('透明化で回避！');w.dead=true}if(!w.dead&&((w.side==='p'&&w.y<45)||(w.side==='e'&&w.y>755)))w.dead=true}walkers=walkers.filter(w=>!w.dead);for(let m of mines){if(Math.hypot(p.x-m.x,p.y-m.y)<24)p.hp=0;if(Math.hypot(e.x-m.x,e.y-m.y)<24)e.hp=0}p.hp=clamp(p.hp,0,100);e.hp=clamp(e.hp,0,100);if(tick%8===0)updateGauge();document.querySelector('#ph').style.width=p.hp+'%';document.querySelector('#eh').style.width=e.hp+'%';if(p.hp<=0||e.hp<=0)finish()}}draw();requestAnimationFrame(update)}
function drawWalker(w){g.save();g.translate(w.x,w.y);let s=w.kind==='stun'?1.65:w.kind==='mega'?1.35:1;g.scale(s,s);g.fillStyle=w.kind==='stun'?'#56304b':w.kind==='mega'?'#a63f33':'#684632';g.beginPath();g.ellipse(0,5,12,10,0,0,7);g.fill();g.beginPath();g.ellipse(0,-3,9,8,0,0,7);g.fill();g.beginPath();g.ellipse(0,-10,6,6,0,0,7);g.fill();g.fillStyle='#a98661';g.beginPath();g.arc(-2,-11,2,0,7);g.fill();g.strokeStyle='#392922';g.lineWidth=2;g.beginPath();let leg=Math.sin(w.step*.4)*3;g.moveTo(-5,12);g.lineTo(-7+leg,17);g.moveTo(5,12);g.lineTo(7-leg,17);g.stroke();if(w.kind==='stun'||w.kind==='mega'){g.fillStyle=w.kind==='stun'?'#ffff75':'#ffbb58';g.font='bold 14px sans-serif';g.textAlign='center';g.fillText(w.kind==='stun'?'⚡':'🔥',0,-19)}g.restore()}
function drawFox(fox){if(!fox)return;g.save();let wiggle=fox.state==='windup'?Math.sin(performance.now()/65)*3:0;g.fillStyle='#a84e2f';g.beginPath();g.ellipse(fox.x-fox.dir*13,fox.y+7+wiggle,12,7,fox.dir*.2,0,7);g.fill();g.font='36px sans-serif';g.textAlign='center';g.fillText('🦊',fox.x,fox.y+12);if(fox.state==='windup'){let remain=Math.max(0,fox.windupUntil-performance.now());g.strokeStyle='rgba(255,90,55,.9)';g.lineWidth=4;g.beginPath();g.arc(fox.targetX,fox.y,27+Math.sin(performance.now()/100)*3,0,7);g.stroke();g.fillStyle='#39261e';g.fillRect(fox.targetX-30,fox.y+29,60,5);g.fillStyle='#f3d15e';g.fillRect(fox.targetX-30,fox.y+29,60*(1-remain/2200),5);g.fillStyle='#fff5df';g.font='bold 17px system-ui';g.shadowColor='#37271f';g.shadowBlur=5;g.fillText('ぷりっ…',fox.targetX,fox.y-38)}g.restore()}
function drawResultFx(){let t=performance.now()-finishAt,k=Math.min(1,t/650),bounce=1+Math.sin(t/110)*.07,loseY=resultSide==='p'?535:270,winY=resultSide==='p'?225:675;g.save();g.fillStyle='rgba(13,22,17,.52)';g.fillRect(0,0,W,H);for(let i=0;i<24;i++){let xx=(i*83+t*(.035+(i%4)*.014))%W,yy=(i*127+t*(.07+(i%3)*.02))%H;g.fillStyle=['#f4d65d','#f28461','#b8e1a4','#f7eee0'][i%4];g.globalAlpha=.8;g.save();g.translate(xx,yy);g.rotate(t*.004+i);g.fillRect(-3,-5,6,10);g.restore()}g.globalAlpha=1;g.save();g.translate(240,loseY-28);g.scale(k*bounce,k*bounce);g.strokeStyle='rgba(255,237,140,.8)';g.lineWidth=4;for(let i=0;i<14;i++){let a=i*Math.PI/7,r1=76,r2=130+Math.sin(t/120+i)*10;g.beginPath();g.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);g.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);g.stroke()}g.font='130px serif';g.textAlign='center';g.fillText('💩',0,22);g.restore();g.textAlign='center';g.font='900 42px system-ui';g.lineWidth=7;g.strokeStyle='#18231a';g.fillStyle='#ffe9d2';g.strokeText('LOSE',240,loseY+56);g.fillText('LOSE',240,loseY+56);g.fillStyle='#ffe979';g.font='900 48px system-ui';g.strokeText('WIN',240,winY);g.fillText('WIN',240,winY);g.restore()}
